name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # GitHub 스케줄러는 '정시 근처'에 부하가 몰려 실행이 지연·누락(drop)됨 → 어정쩡한 분(分)으로 회피
    - cron: '23 20 * * *' # 한국시간 05:23 (UTC 20:23)
  # 📌 5/31 자동배포 재개 / 6/2 누락 대응: 혼잡시간 회피
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Public Data and Generate Blog Post
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/fetch-public-data.js
          node scripts/dedup-festivals-v2.js
          # ── [SHELVED 2026-06-05] 블로그 자동발행 중지(thin→손글 전환). fetch·dedup·validate는 유지. 되살리려면 아래 4줄 주석 해제.
          # node scripts/generate-blog-post.js
          # echo "Gemini 과부하 방지를 위해 3분 대기 중..."
          # sleep 180
          # POST_TYPE=festival node scripts/generate-blog-post.js
          echo "콘텐츠 검증 게이트 실행 (자동 정규화 + 깨진 글 격리)..."
          node scripts/validate-content.js --fix --quarantine
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          GYEONGGI_API_KEY: ${{ secrets.GYEONGGI_API_KEY }}
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Commit and Push Changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "자동 업데이트: 공공데이터 수집" && git pull --rebase && git push)

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=my-pick-info --commit-message="Auto deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
